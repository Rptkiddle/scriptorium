[project]
name = "scriptorium-server"
version = "0.1.0"
description = "Scriptorium server: a shared literature collection served to members' agents"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pikepdf>=10.18",
    "psycopg[binary,pool]>=3.2",
    "requests>=2.32",
    "sentence-transformers>=3",
    "torch>=2",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
scriptorium = "scriptorium_server.admin:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=9.1.1",
]

# On Linux, PyTorch comes from its CUDA 12.6 builds, which run on NVIDIA
# drivers from version 560 on (and on the CPU where there is no GPU). The
# default builds need a newer driver than many servers have.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/scriptorium_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: loads the real embedding model (skipped when it is not in the local cache)"]
