# The Scriptorium server as a set of containers. Values come from the .env
# file beside this one (see .env.example). Everything that must outlive a
# container is kept in SCRIPTORIUM_DATA on the host:
#   postgres/   the database's files
#   data/       PDFs, parsed full texts, run folders, backups, the embedding model
#   settings/   settings.toml
#
#   docker compose up -d                           start the database and the web service
#   docker compose run --rm cli <command>          run the admin command, e.g. `cli migrate`

name: scriptorium

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: scriptorium
      POSTGRES_DB: scriptorium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Europe/Amsterdam}
    command:
      - postgres
      - -c
      - shared_buffers=${DB_SHARED_BUFFERS:-2GB}
      - -c
      - maintenance_work_mem=${DB_MAINTENANCE_WORK_MEM:-1GB}
    shm_size: 1gb
    volumes:
      - ${SCRIPTORIUM_DATA:?set SCRIPTORIUM_DATA in .env}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scriptorium -d scriptorium"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The web service members' clients talk to. It listens on this machine
  # only; the host's web server passes requests on to it. Queries are
  # embedded on the CPU, so the service does not depend on a GPU.
  server:
    image: scriptorium-server
    restart: unless-stopped
    user: "${SCRIPTORIUM_UID:-1000}:${SCRIPTORIUM_GID:-1000}"
    command: ["serve", "--host", "0.0.0.0", "--port", "8765"]
    environment:
      SCRIPTORIUM_DATABASE_ADDRESS: postgresql://scriptorium:${POSTGRES_PASSWORD}@db/scriptorium
      SCRIPTORIUM_DEVICE: cpu
      TZ: ${TZ:-Europe/Amsterdam}
    ports:
      - "127.0.0.1:${SCRIPTORIUM_PORT:-8765}:8765"
    volumes:
      - ${SCRIPTORIUM_DATA}/data:/srv/scriptorium
      - ${SCRIPTORIUM_DATA}/settings:/etc/scriptorium
    depends_on:
      db:
        condition: service_healthy

  # The admin command, run once per call and removed afterwards.
  cli:
    profiles: ["cli"]
    build:
      context: server
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    image: scriptorium-server
    user: "${SCRIPTORIUM_UID:-1000}:${SCRIPTORIUM_GID:-1000}"
    environment:
      SCRIPTORIUM_DATABASE_ADDRESS: postgresql://scriptorium:${POSTGRES_PASSWORD}@db/scriptorium
      TZ: ${TZ:-Europe/Amsterdam}
    volumes:
      - ${SCRIPTORIUM_DATA}/data:/srv/scriptorium
      - ${SCRIPTORIUM_DATA}/settings:/etc/scriptorium
    depends_on:
      db:
        condition: service_healthy
